<!DOCTYPE html>
<html>
    <head>
        <title>Reaction Time</title>
        <style>
            body{
                font-family: Arial, sans-serif;
                text-align:center;
                background-color:white;
                color:black;
                padding-top:100px;
            }
            #box{
                width:300px;
                height:300px;
                background-color:red;
                margin:0 auto;
                display:none;
            }
        </style>
    </head>
    <body>
        <h1>Reaction Time Test</h1>
        <p id="text">Press SPACE to start the game!</p>
        <div id="box"></div>
        <script>
            var gameStarted=false;
            var isGreen=false;
            var startTime=0;
            var endTime=0;
            var timerId;

            window.addEventListener("keydown",function(event){
                if(event.code==="Space"){
                    if(gameStarted===false){
                        gameStarted=true;
                        document.getElementById("text").innerText="Wait for green...";
                        var randomDelay=Math.random()*3000+2000;
                        timerId=setTimeout(makeGreen, randomDelay);
                    }
                    else if(isGreen===true){
                        endTime=Date.now();
                        var score=endTime-startTime;
                        document.getElementById("text").innerText="Your time: "+score+"ms! Press SPACE to try again.";
                    }
                    else{
                        clearTimeout(timerId);
                        document.getElementById("text").innerText="Too early! Press SPACE to try again.";
                        gameStarted=false;
                    }
                }
            });
            function makeGreen(){
                isGreen=true;
                document.getElementById("box").style.backgroundColor="green";
                document.getElementById("box").style.display="block";
                document.getElementById("text").innerText="PRESS SPACE NOW!";
                startTime=Date.now();
            }
        </script>
    </body>
</html>
