<!DOCTYPE html>
<html>
    <head>
        <title>Reaction Time</title>
        <style>
            body{
                font-family:"Courier New", Courier, monospace;
                background-color:#ce4242;
                color:black;
                transition:background-color 0.5s ease;
                margin:0;
                height:100vh;
                display:flex;
                flex-direction:column;
                justify-content:center;
                align-items:center;
                text-align:center;
            }
            h1{
                font-size:56px;
                margin-bottom:20px;
            }
            #text{
                font-size:28px;
                max-width:700px;
                line-height:1.5;
            }
        </style>
    </head>
    <body>
        <h1>Reaction Time Test</h1>
        <p id="text">Press SPACE to start the game!</p>
        <script>
            var gameStarted=false;
            var isGreen=false;
            var startTime=0;
            var endTime=0;
            var timerId;
            var canPress=true;
            var round=0;
            var totalScore=0;
            var bestScore=9999;
            var maxRound=5;

            function resetGame(){
                gameStarted=false;
                isGreen=false;
                startTime=0;
                endTime=0;
                clearTimeout(timerId);
            }
            window.addEventListener("keydown",function(event){
                if(event.code!=="Space" || !canPress){
                    return;
                }
                canPress=false;
                if(event.code==="Space"){
                    if(gameStarted===false){
                        gameStarted=true;
                        round=0;
                        totalScore=0;
                        bestScore=9999;
                        document.body.style.backgroundColor="#ce4242";
                        document.getElementById("text").innerText="Wait for green...";
                        var randomDelay=Math.random()*3000+2000;
                        timerId=setTimeout(makeGreen, randomDelay);
                    }
                    else if(isGreen===true){
                        endTime=Date.now();
                        var score=endTime-startTime;
                        document.body.style.backgroundColor="white";
                        document.getElementById("text").innerText="Your time: "+score+"ms! Press SPACE to try again.";
                        resetGame();
                    }
                    else{
                        clearTimeout(timerId);
                        document.getElementById("text").innerText="Too early! Press SPACE to try again.";
                        resetGame();
                        gameStarted=false;
                    }
                }
                setTimeout(function(){
                    canPress=true;
                },200);
            });
            function makeGreen(){
                isGreen=true;
                document.body.style.backgroundColor="#2ed573";
                document.getElementById("text").innerText="PRESS SPACE NOW!";
                startTime=Date.now();
            }
        </script>
    </body>
</html>
